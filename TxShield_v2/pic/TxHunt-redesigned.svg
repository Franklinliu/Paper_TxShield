<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F7FAFC"/><stop offset="1" stop-color="#EEF5F8"/></linearGradient>
    <linearGradient id="blue" x1="0" x2="1"><stop stop-color="#0B6E99"/><stop offset="1" stop-color="#31A6C7"/></linearGradient>
    <linearGradient id="violet" x1="0" x2="1"><stop stop-color="#6857C8"/><stop offset="1" stop-color="#8A75E8"/></linearGradient>
    <linearGradient id="orange" x1="0" x2="1"><stop stop-color="#E85D3F"/><stop offset="1" stop-color="#F39A3E"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0B2633" flood-opacity=".13"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#244653"/></marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#1685AD"/></marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#EA7042"/></marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2B8B57"/></marker>
    <style>
      text{font-family:Inter,Arial,sans-serif;fill:#17333F} .title{font-size:29px;font-weight:750}.sub{font-size:17px;fill:#52707C}.step{font-size:15px;font-weight:750;letter-spacing:.7px}.badge{font-size:12px;font-weight:750;letter-spacing:.35px}.cardTitle{font-size:21px;font-weight:750}.body{font-size:17px}.tiny{font-size:14px}.white{fill:#fff}.muted{fill:#65808B}.center{text-anchor:middle}.caps{letter-spacing:1.5px}.italic{font-style:italic}
    </style>
  </defs>
  <rect width="1600" height="760" rx="28" fill="url(#bg)"/>

  <text x="70" y="62" class="title">TxHunt: Retrieval-Augmented DeFi Attack Detection</text>
  <text x="70" y="92" class="sub">From raw transactions to an interpretable attack decision</text>

  <!-- stage bands -->
  <rect x="360" y="122" width="1170" height="214" rx="24" fill="#EAF5F9" stroke="#A8D3E2" stroke-width="2"/>
  <rect x="360" y="371" width="1170" height="323" rx="24" fill="#F2EFFC" stroke="#C7BDF1" stroke-width="2"/>
  <rect x="385" y="104" width="267" height="38" rx="19" fill="url(#blue)"/>
  <text x="518" y="130" class="step white center caps">HISTORY KNOWLEDGE</text>
  <rect x="385" y="353" width="244" height="38" rx="19" fill="url(#violet)"/>
  <text x="507" y="379" class="step white center caps">ATTACK DETECTION</text>

  <!-- input -->
  <g filter="url(#shadow)"><rect x="55" y="228" width="245" height="196" rx="22" fill="#fff" stroke="#C8D6DC" stroke-width="2"/></g>
  <circle cx="177" cy="280" r="35" fill="#FFF0D8"/><path d="M150 267h54v31h-54z" fill="none" stroke="#D18420" stroke-width="4"/><circle cx="177" cy="282" r="11" fill="none" stroke="#D18420" stroke-width="4"/><path d="M145 273h-8m75 19h8" stroke="#D18420" stroke-width="4" stroke-linecap="round"/>
  <text x="177" y="346" class="cardTitle center">Raw Transaction</text><text x="177" y="374" class="cardTitle center">Data</text>
  <rect x="84" y="391" width="186" height="7" rx="4" fill="#F2B54A"/>

  <!-- step 1 -->
  <path d="M177 424V494" stroke="#244653" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="62" y="451" width="143" height="28" rx="14" fill="#17333F"/><text x="133" y="470" class="step white center">1 · PREPROCESS</text>
  <g filter="url(#shadow)"><rect x="55" y="505" width="245" height="155" rx="22" fill="#fff" stroke="#C8D6DC" stroke-width="2"/></g>
  <path d="M103 574l34-26 38 19 36-31 42 25m-150 13l42 30 36-18 45 27" fill="none" stroke="#5B7F8C" stroke-width="4"/>
  <g fill="#9AD277" stroke="#31535F" stroke-width="3"><circle cx="103" cy="574" r="9"/><circle cx="137" cy="548" r="9"/><circle cx="175" cy="567" r="9"/><circle cx="211" cy="536" r="9"/><circle cx="253" cy="561" r="9"/><circle cx="145" cy="604" r="9"/><circle cx="181" cy="586" r="9"/><circle cx="226" cy="613" r="9"/></g>
  <text x="177" y="639" class="body center">Pruned execution trace tree</text>

  <!-- knowledge cards -->
  <g filter="url(#shadow)"><rect x="405" y="164" width="255" height="132" rx="18" fill="#fff"/></g>
  <circle cx="447" cy="204" r="22" fill="#D7EDF5"/><text x="447" y="212" font-size="25" class="center">⌘</text>
  <text x="480" y="202" class="cardTitle">Exploit Scripts</text><text x="430" y="242" class="body">Historical attack logic</text><text x="430" y="268" class="tiny muted">expert-curated corpus</text>
  <g filter="url(#shadow)"><rect x="713" y="164" width="255" height="132" rx="18" fill="#fff"/></g>
  <circle cx="755" cy="204" r="22" fill="#E5E0FA"/><text x="755" y="212" font-size="23" class="center">✦</text>
  <text x="788" y="202" class="cardTitle">Attack Simulation</text><text x="738" y="242" class="body">Replay exploit scripts</text><text x="738" y="268" class="tiny muted">generate attack transactions</text>
  <g filter="url(#shadow)"><rect x="1021" y="164" width="255" height="132" rx="18" fill="#fff"/></g>
  <circle cx="1063" cy="204" r="22" fill="#DDF3EA"/><path d="M1052 197h22m-22 8h22m-22 8h22" stroke="#26835A" stroke-width="3"/>
  <text x="1096" y="202" class="cardTitle">Behavior Traces</text><text x="1046" y="242" class="body">Sanitized transactions</text><text x="1046" y="268" class="tiny muted">execution behavior only</text>
  <g filter="url(#shadow)"><rect x="1329" y="164" width="157" height="132" rx="18" fill="#fff"/></g>
  <circle cx="1407" cy="207" r="26" fill="#D7EDF5"/><path d="M1393 199h28v19h-28zM1398 194h18" fill="none" stroke="#147CA5" stroke-width="3"/>
  <text x="1407" y="252" class="cardTitle center">Vector DB</text><text x="1407" y="277" class="tiny muted center">indexed cases</text>
  <path d="M660 230H700" stroke="#1685AD" stroke-width="4" marker-end="url(#arrowBlue)"/><text x="680" y="216" class="tiny muted center italic">simulate</text>
  <path d="M968 230H1008" stroke="#1685AD" stroke-width="4" marker-end="url(#arrowBlue)"/><text x="988" y="216" class="tiny muted center italic">sanitize</text>
  <path d="M1276 230H1316" stroke="#1685AD" stroke-width="4" marker-end="url(#arrowBlue)"/><text x="1296" y="216" class="tiny muted center italic">embed</text>
  <!-- Exploit scripts are also summarized; both representations are indexed. -->
  <path d="M533 296V316H1250V286H1316" fill="none" stroke="#1685AD" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#arrowBlue)"/>
  <rect x="700" y="302" width="250" height="29" rx="14.5" fill="#FFFFFF" stroke="#9CCDDD" stroke-width="1.5"/>
  <text x="825" y="322" class="tiny center"><tspan font-weight="700">LLM summary</tspan><tspan class="muted"> + metadata</tspan></text>

  <!-- retrieval -->
  <path d="M300 582H405" stroke="#244653" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="306" y="538" width="98" height="28" rx="14" fill="#17333F"/><text x="355" y="557" class="badge white center">2 · RETRIEVE</text>
  <g filter="url(#shadow)"><rect x="405" y="421" width="325" height="226" rx="20" fill="#fff"/></g>
  <text x="432" y="459" class="cardTitle">Top-k Similar Cases</text>
  <rect x="432" y="479" width="271" height="54" rx="12" fill="#EAF5F9"/><circle cx="458" cy="506" r="13" fill="#31A6C7"/><text x="483" y="513" class="body">Reference summary + trace</text>
  <rect x="432" y="544" width="271" height="54" rx="12" fill="#EAF5F9"/><circle cx="458" cy="571" r="13" fill="#31A6C7"/><text x="483" y="578" class="body">Reference summary + trace</text>
  <text x="567" y="620" class="tiny muted center">retrieval context</text>
  <path d="M1407 296V340H568V408" fill="none" stroke="#1685AD" stroke-width="4" stroke-dasharray="8 7" marker-end="url(#arrowBlue)"/>

  <!-- analyze -->
  <path d="M730 535H793" stroke="#244653" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="728" y="491" width="78" height="28" rx="14" fill="#17333F"/><text x="767" y="510" class="badge white center" font-size="10.5">3 · ANALYZE</text>
  <g filter="url(#shadow)"><rect x="806" y="421" width="245" height="226" rx="20" fill="#fff"/></g>
  <circle cx="928" cy="492" r="45" fill="#E7E2FA"/><text x="928" y="505" font-size="38" class="center">✦</text>
  <text x="928" y="560" class="cardTitle center">LLM Reasoner</text><text x="928" y="590" class="body center">Target trace + retrieved</text><text x="928" y="615" class="body center">history → explanation</text>

  <!-- candidates -->
  <path d="M1051 535H1110" stroke="#EA7042" stroke-width="4" marker-end="url(#arrowOrange)"/>
  <g filter="url(#shadow)"><rect x="1122" y="421" width="206" height="102" rx="20" fill="#FFF3EA" stroke="#F2B08E" stroke-width="2"/></g>
  <circle cx="1162" cy="472" r="23" fill="#E85D3F"/><text x="1162" y="480" font-size="24" class="white center">!</text><text x="1200" y="466" class="cardTitle" fill="#A93B28">Attack</text><text x="1200" y="492" class="body" fill="#A93B28">candidates</text>
  <g filter="url(#shadow)"><rect x="1122" y="545" width="206" height="102" rx="20" fill="#EBF7F0" stroke="#9CD2B4" stroke-width="2"/></g>
  <circle cx="1162" cy="596" r="23" fill="#2B8B57"/><text x="1162" y="604" font-size="23" class="white center">✓</text><text x="1200" y="590" class="cardTitle" fill="#236D47">Benign</text><text x="1200" y="616" class="body" fill="#236D47">cases</text>

  <!-- classifier + result -->
  <path d="M1328 534H1365" stroke="#244653" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="1301" y="490" width="74" height="28" rx="14" fill="#17333F"/><text x="1338" y="509" class="badge white center" font-size="10.5">5 · FILTER</text>
  <g filter="url(#shadow)"><rect x="1377" y="421" width="109" height="226" rx="20" fill="#fff"/></g>
  <text x="1432" y="465" class="tiny muted center caps">XGBOOST</text><path d="M1405 500h53M1405 521h53M1405 542h53" stroke="#6857C8" stroke-width="7" stroke-linecap="round"/><text x="1432" y="586" class="cardTitle center">Classifier</text><text x="1432" y="614" class="tiny muted center">trained on</text><text x="1432" y="635" class="tiny muted center">behavior traces</text>
  <rect x="1271" y="313" width="128" height="28" rx="14" fill="#6857C8"/><text x="1335" y="332" class="step white center">4 · TRAIN</text>
  <path d="M1210 296V326H1432V408" fill="none" stroke="#6857C8" stroke-width="4" stroke-dasharray="8 7" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)"><rect x="1505" y="421" width="76" height="226" rx="20" fill="url(#orange)"/></g>
  <path d="M1543 477v72m-20-20l20 20 20-20" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text transform="translate(1549 606) rotate(-90)" class="step white center caps">RESULT</text>
</svg>
