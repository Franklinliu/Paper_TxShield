<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#34495E"/></marker>
    <marker id="arrowOrange" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#D95F32"/></marker>
    <marker id="arrowGreen" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2E7D4F"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#1F2933}.section{font-size:24px;font-weight:700}.label{font-size:20px;font-weight:600}.body{font-size:18px}.small{font-size:16px}.step{font-size:19px}.italic{font-style:italic}.center{text-anchor:middle}.box{fill:#FFFFFF;stroke:#8FA6B2;stroke-width:1.8}.group{fill:#FFFFFF;stroke:#456B7A;stroke-width:2.2;stroke-dasharray:8 7}.line{fill:none;stroke:#34495E;stroke-width:2.6;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="720" fill="#FFFFFF"/>

  <!-- History Knowledge Construction -->
  <rect x="430" y="28" width="1050" height="272" rx="18" class="group"/>
  <text x="452" y="70" class="section">History Knowledge</text>
  <text x="452" y="98" class="section">Construction</text>

  <rect x="640" y="48" width="265" height="58" rx="6" class="box"/>
  <text x="772" y="84" class="label center">Exploit Scripts</text>

  <!-- exploit scripts to LLM summary -->
  <path d="M772 106V160" class="line"/>
  <g transform="translate(739 159)">
    <rect x="0" y="9" width="66" height="38" rx="8" fill="#E8F2F6" stroke="#456B7A" stroke-width="1.5"/>
    <circle cx="18" cy="28" r="6" fill="#3C91B3"/><circle cx="48" cy="28" r="6" fill="#3C91B3"/>
    <path d="M14 42h38M33 9V1M28 1h10" stroke="#456B7A" stroke-width="2" fill="none"/>
  </g>
  <text x="827" y="193" class="label">LLM</text>
  <text x="755" y="232" class="body center">Summary</text>
  <text x="755" y="255" class="body center">Metadata</text>

  <!-- exploit scripts to attack transactions -->
  <path d="M905 77H1095" class="line"/>
  <text x="999" y="64" class="small italic center" fill="#657785">simulate</text>
  <text x="1160" y="72" class="label center">Attack</text>
  <text x="1160" y="98" class="label center">Transactions</text>

  <!-- attack transactions to behavior traces -->
  <path d="M1160 108V164" class="line"/>
  <text x="1212" y="139" class="small italic" fill="#657785">sanitize</text>
  <text x="1160" y="198" class="label center">Behavior</text>
  <text x="1160" y="224" class="label center">Traces</text>

  <!-- behavior traces to vector database -->
  <path d="M1090 207H975" class="line"/>
  <text x="1032" y="192" class="small italic center" fill="#657785">embed</text>
  <text x="945" y="198" class="label center">Vector</text>
  <text x="945" y="224" class="label center">Database</text>
  <text x="860" y="222" class="label center">+</text>

  <!-- Raw Transaction Data -->
  <g transform="translate(135 212)">
    <rect x="0" y="0" width="105" height="72" rx="7" class="box"/>
    <path d="M16 17h74M18 31h24M18 45h16M72 44h20" stroke="#34495E" stroke-width="3" stroke-linecap="round"/>
    <circle cx="24" cy="31" r="5" fill="#E66B62" stroke="#34495E" stroke-width="2"/>
    <circle cx="59" cy="31" r="5" fill="#E66B62" stroke="#34495E" stroke-width="2"/>
    <circle cx="52" cy="52" r="17" fill="#F5C56B" stroke="#34495E" stroke-width="2"/>
    <text x="52" y="59" class="label center">$</text>
  </g>
  <text x="188" y="314" class="label center">Raw Transaction Data</text>

  <!-- preprocess -->
  <path d="M188 330V445" class="line"/>
  <text x="28" y="405" class="step">1. Preprocess</text>
  <text x="188" y="474" class="label center">Pruned</text>
  <text x="188" y="500" class="label center">Execution Trace Tree</text>
  <g transform="translate(135 520)" stroke="#455A64" stroke-width="3" fill="none">
    <path d="M10 34L42 8L72 28L105 3M42 8L54 55L72 28L100 63M54 55L88 45"/>
    <g fill="#9FCC71"><circle cx="10" cy="34" r="8"/><circle cx="42" cy="8" r="8"/><circle cx="72" cy="28" r="8"/><circle cx="105" cy="3" r="8"/><circle cx="54" cy="55" r="8"/><circle cx="88" cy="45" r="8"/><circle cx="100" cy="63" r="8"/></g>
  </g>

  <!-- Attack Detection -->
  <rect x="515" y="370" width="950" height="320" rx="18" class="group"/>
  <text x="1275" y="666" class="section italic">DeFi Attack Detection</text>

  <!-- query and retrieval; original branch to history knowledge -->
  <path d="M248 566H450V627H575" class="line"/>
  <path d="M450 566V301" class="line"/>
  <text x="306" y="407" class="step center">2. Query &amp;</text>
  <text x="306" y="432" class="step center">Retrieval</text>

  <!-- retrieved prompt stack -->
  <rect x="560" y="390" width="350" height="270" rx="18" class="box"/>
  <rect x="575" y="405" width="320" height="83" rx="7" fill="#EEF2F4" stroke="#8FA6B2" stroke-width="1.5"/>
  <text x="735" y="438" class="label center">Reference</text>
  <text x="735" y="468" class="label center">summary &amp; trace</text>
  <text x="735" y="505" class="label center">...</text>
  <rect x="575" y="520" width="320" height="72" rx="7" fill="#EEF2F4" stroke="#8FA6B2" stroke-width="1.5"/>
  <text x="735" y="549" class="label center">Reference</text>
  <text x="735" y="578" class="label center">summary &amp; trace</text>
  <rect x="575" y="605" width="320" height="45" rx="7" fill="#FFFFFF" stroke="#8FA6B2" stroke-width="1.5"/>
  <text x="735" y="633" class="label center">Target execution trace</text>

  <!-- Top-k cases -->
  <path d="M735 300V378" class="line"/>
  <g transform="translate(747 307)"><rect width="23" height="29" fill="#E8F2F6" stroke="#456B7A"/><path d="M5 8h13M5 14h13M5 20h8" stroke="#456B7A"/><circle cx="21" cy="24" r="8" fill="#3C91B3" stroke="#34495E"/></g>
  <text x="785" y="331" class="label">Top-<tspan font-style="italic">k</tspan> cases</text>

  <!-- Analyze with LLM -->
  <path d="M910 525H1035" class="line"/>
  <text x="937" y="506" class="step">3. Analyze</text>
  <g transform="translate(1018 545)">
    <rect width="58" height="34" rx="7" fill="#E8F2F6" stroke="#456B7A" stroke-width="1.5"/>
    <circle cx="16" cy="17" r="5" fill="#3C91B3"/><circle cx="42" cy="17" r="5" fill="#3C91B3"/>
    <path d="M29 0V-8M24-8h10" stroke="#456B7A" stroke-width="2"/>
  </g>
  <text x="1085" y="572" class="label">LLM</text>

  <!-- LLM output branches -->
  <path d="M1100 535L1155 490" fill="none" stroke="#D95F32" stroke-width="3" marker-end="url(#arrowOrange)"/>
  <path d="M1100 545L1155 590" fill="none" stroke="#2E7D4F" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <text x="1215" y="476" class="label center" fill="#B54224">Attack</text>
  <text x="1215" y="502" class="label center" fill="#B54224">Candidates</text>
  <text x="1215" y="585" class="label center" fill="#276A45">Benign</text>
  <text x="1215" y="611" class="label center" fill="#276A45">Cases</text>

  <!-- XGBoost training and classifier -->
  <path d="M1320 300V430" class="line"/>
  <text x="1108" y="344" class="step">4. Train <tspan font-style="italic">XGBoost</tspan></text>
  <text x="1298" y="468" class="label italic">Classifier</text>

  <!-- Filter to result -->
  <path d="M1265 505H1480" class="line"/>
  <text x="1330" y="548" class="step">5. Filter</text>
  <path d="M1480 420H1590V620Q1535 645 1480 620Z" fill="#FFFFFF" stroke="#456B7A" stroke-width="2"/>
  <text x="1535" y="458" class="label center">Result</text>
  <text x="1535" y="495" class="body italic center">Attack Decision</text>
  <text x="1535" y="528" class="body center">+</text>
  <text x="1535" y="563" class="body italic center">Interpretation</text>
</svg>
